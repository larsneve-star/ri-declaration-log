name: Lotus baseline integrity
on:
  push:
    branches: [forslag-tillidsmoede]
    paths: ['charter-runde-1/**', '.github/workflows/charter-automation.yml']
  pull_request:
    paths: ['charter-runde-1/**', '.github/workflows/charter-automation.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check canonical frozen bytes
        shell: bash
        run: |
          cd charter-runde-1
          printf '%s\n' '1a52e04e26263f1c9933ce61b42567732aa4eb48460f62255a46484328a064fd  LOTUS-PROTOCOL-1.3.md' | sha256sum --check --strict
          sha256sum --check --strict HASHES.txt
