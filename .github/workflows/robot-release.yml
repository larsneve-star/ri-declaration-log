name: "Auto: release at the deadline"

# Every hour the robot looks at each open round. When all six have answered,
# or the deadline has passed, it releases the round and logs missing answers.

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: log-robot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check deadlines
        run: python3 tools/robot.py tick
      - name: Save the new log lines
        run: |
          git config user.name "ri-log-robot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A round-*/
          if git diff --cached --quiet; then echo "Nothing to log."; exit 0; fi
          git commit -m "Log robot: ${{ github.workflow }}"
          for i in 1 2 3 4 5; do git push && exit 0; sleep 5; git pull --rebase; done
          exit 1
