name: "Auto: register every change in the log"

# After every change, the robot adds lines to the round's LOG.md: every new file
# with its SHA-256 and time, a warning for every deletion, rename or edit of a
# frozen file, and an immediate check of any newly delivered compiled part.

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: log-robot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Register
        run: python3 tools/robot.py register "${{ github.event.before }}" "${{ github.sha }}"
      - name: Save the new log lines
        run: |
          git config user.name "ri-log-robot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A round-*/
          if git diff --cached --quiet; then echo "Nothing to log."; exit 0; fi
          git commit -m "Log robot: ${{ github.workflow }}"
          for i in 1 2 3 4 5; do git push && exit 0; sleep 5; git pull --rebase; done
          exit 1
